#!/bin/bash

DEBUG=0

LOG_LEVEL=INFO

VERSION="2.9.5"

MODE="production"

##################################################
# Paths
##################################################

ARE_HOME="/opt/are"
ARE_DATA="/var/lib/are"

ARE_BIN="$ARE_HOME/are.sh"
ARE_CONFIG="$ARE_HOME/config/config.conf"
ARE_POLICY_CONFIG="$ARE_HOME/config/policy.conf"
ARE_JAIL_SCALE_CONFIG="$ARE_HOME/config/jail_scale.conf"
ARE_WHITELIST="$ARE_HOME/config/whitelist.conf"

ARE_SENSOR_DIR="$ARE_HOME/sensors"
ARE_POLICY_DIR="$ARE_HOME/policy"
ARE_DASHBOARD_DIR="$ARE_HOME/dashboard"
ARE_TESTING_DIR="$ARE_HOME/testing"
ARE_TMP_DIR="$ARE_HOME/tmp"

##################################################
# IPSET
##################################################

FILTER_SET4="are-filter"
FILTER_SET6="are-filter6"

BAN_SET4="are-blacklist"
BAN_SET6="are-blacklist6"

##################################################
# Database
##################################################

DB_FILE="$ARE_DATA/are.db"
DB_TIMEOUT=5000
DB_DEBUG=0

##################################################
# Whitelist
##################################################

WHITELIST="$ARE_WHITELIST"

##################################################
# Logging
##################################################

ARE_LOG_DIR="/var/log/are"
ARE_LOG_FILE="$ARE_LOG_DIR/are.log"
LOGTAG="ARE"

##################################################
# Sensors
##################################################
FAIL2BAN_LOG_FILE="/var/log/fail2ban.log"

# Constante a agregar en config.conf
IPSET_MAX_TIMEOUT=2147483


SPAMASSASSIN_MTA="exim"
SPAMASSASSIN_LOG_FILE="/var/log/exim_mainlog"

##################################################
# Web Correlation Sensor (IDEA-010)
# WEB_CORRELATION_LOG_FILE es obligatorio y específico de cada
# sitio — sin valor por defecto, el sensor falla explícito si
# no está configurado.
##################################################
WEB_CORRELATION_PATH_MARKER="cart"
WEB_CORRELATION_IP_THRESHOLD=10
WEB_CORRELATION_JAIL="web-correlation"

##################################################
# Web Scanner Sensor (reconocimiento de rutas sensibles)
# Lee un access_log combined (nginx o Apache) y reporta IPs que
# piden rutas que ningún visitante legítimo pide (.env, .git,
# .ssh, respaldos, phpinfo...). Unidad systemd OPCIONAL: no se
# habilita sola. Para activarla, definir WEB_SCANNER_LOG_FILE y
# habilitar are-web-scanner.timer (ARE ADMIN > Sensores).
# En nginx detrás de un proxy o túnel, el log debe registrar la
# IP real (real_ip_header), no la del proxy.
##################################################
# WEB_SCANNER_LOG_FILE acepta varias rutas y/o globs separados por
# espacios; cada archivo lleva su propio offset. Ejemplos:
#   WEB_SCANNER_LOG_FILE="/var/log/nginx/access.log"
#   WEB_SCANNER_LOG_FILE="/usr/local/apache/domlogs/*-ssl_log"   (cPanel)
# WEB_SCANNER_LOG_FILE="/var/log/nginx/access.log"
WEB_SCANNER_JAIL="web-scanner"
WEB_SCANNER_HIT_THRESHOLD=5

##################################################
# Whitelist Auto-Sync
##################################################
WHITELIST_SYNC_URL_V4="https://www.cloudflare.com/ips-v4"
WHITELIST_SYNC_URL_V6="https://www.cloudflare.com/ips-v6"
WHITELIST_SYNC_MARKER="CLOUDFLARE"

MAIL_ANTIVIRUS_LOG_FILE="/var/log/exim_mainlog"
MAIL_ANTIVIRUS_JAIL="mail-antivirus"
